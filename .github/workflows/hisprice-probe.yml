name: HisPrice Probe
on:
  push:
    paths:
      - '.github/workflows/hisprice-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and analyze HisPrice assets
        run: |
          python - <<'PY'
          import re, json, urllib.request, hashlib, pathlib
          assets = {
            'chart18': 'https://www.hisprice.com/codejs/chart18.js?t=19',
            'v': 'https://www.hisprice.com/codejs/v.js',
            'gs': 'https://www.hisprice.com/codejs/gs_n1.js?t=1',
          }
          out = {}
          for name, url in assets.items():
            req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.hisprice.com/'})
            with urllib.request.urlopen(req, timeout=30) as r:
              text = r.read().decode('utf-8','ignore')
            quoted = re.findall(r'''["']([^"']+)["']''', text)
            clues = []
            for s in quoted:
              if len(s) < 300 and re.search(r'(ajax|api|price|history|trend|chart|check|init|data|mck|/)', s, re.I):
                clues.append(s)
            funcs = re.findall(r'function\s+([A-Za-z_$][\w$]*)\s*\(', text)
            calls = []
            for key in ['preinit','docheckLg','ajax','url:','$.get','$.post','getJSON','fetch(']:
              pos = 0
              while True:
                i = text.lower().find(key.lower(), pos)
                if i < 0: break
                frag = re.sub(r'\s+',' ',text[max(0,i-180):min(len(text),i+520)])
                calls.append(frag)
                pos = i + len(key)
                if len(calls) >= 40: break
              if len(calls) >= 40: break
            out[name] = {
              'url': url,
              'length': len(text),
              'sha256': hashlib.sha256(text.encode()).hexdigest(),
              'functions': sorted(set(funcs)),
              'clues': list(dict.fromkeys(clues))[:150],
              'call_snippets': list(dict.fromkeys(calls))[:40],
            }
          pathlib.Path('debug').mkdir(exist_ok=True)
          pathlib.Path('debug/hisprice-analysis.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Commit analysis
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/hisprice-analysis.json
          git diff --cached --quiet || git commit -m 'chore: capture HisPrice endpoint analysis [skip ci]'
          git push
