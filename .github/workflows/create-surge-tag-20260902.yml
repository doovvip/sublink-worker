name: Create Surge v1.0 Tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-surge-tag-20260902.yml"

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable release tag
        env:
          TAG_NAME: surge-v1.0-20260902
          TARGET_SHA: 0272e6fbbaae85b7ffdb959781fa2c3e7a971bea
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Surge stable v1.0 - 2026-09-02"
          git push origin "refs/tags/$TAG_NAME"
