name: HisPrice Runtime Probe
on:
  push:
    paths:
      - '.github/workflows/hisprice-runtime-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract HisPrice source around ptinfo
        run: |
          mkdir -p /tmp/hp debug
          curl -fsSL -A 'Mozilla/5.0' -e 'https://www.hisprice.com/' 'https://www.hisprice.com/codejs/v.js' -o /tmp/hp/v.js
          curl -fsSL -A 'Mozilla/5.0' -e 'https://www.hisprice.com/' 'https://www.hisprice.com/codejs/chart18.js?t=19' -o /tmp/hp/chart18.js
          curl -fsSL -A 'Mozilla/5.0' -e 'https://www.hisprice.com/' 'https://www.hisprice.com/codejs/gs_n1.js?t=1' -o /tmp/hp/gs.js
          python - <<'PY'
          import json,re,pathlib
          out={}
          for name in ['v.js','chart18.js','gs.js']:
              s=pathlib.Path('/tmp/hp/'+name).read_text(errors='ignore')
              hits=[]
              for key in ['ptinfo.php','preinit','preudParam','checkCode','reqid','localJsPreUrl','mtm']:
                  pos=0
                  while len(hits)<40:
                      i=s.lower().find(key.lower(),pos)
                      if i<0: break
                      hits.append({'key':key,'excerpt':re.sub(r'\s+',' ',s[max(0,i-2500):min(len(s),i+5000)])})
                      pos=i+len(key)
              out[name]={'length':len(s),'hits':hits}
          pathlib.Path('debug/hisprice-source.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit source capture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/hisprice-source.json
          git diff --cached --quiet || git commit -m 'chore: capture HisPrice ptinfo source [skip ci]'
          git push
