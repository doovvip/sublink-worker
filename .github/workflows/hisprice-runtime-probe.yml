name: HisPrice Runtime Probe
on:
  push:
    paths:
      - '.github/workflows/hisprice-runtime-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate HisPrice cookie helpers
        run: |
          mkdir -p /tmp/hp debug
          PAGE='https://www.hisprice.com/his.php?hisurl=https%3A%2F%2Fdetail.tmall.com%2Fitem.htm%3Fid%3D957929114177'
          curl -fsSL -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)' "$PAGE" -o /tmp/hp/page.html
          python - <<'PY'
          import re,json,urllib.parse,urllib.request,pathlib
          page=pathlib.Path('/tmp/hp/page.html').read_text(errors='ignore')
          srcs=[]
          for m in re.finditer(r'<script\b[^>]*src=["\']([^"\']+)["\']',page,re.I):
              u=urllib.parse.urljoin('https://www.hisprice.com/',m.group(1))
              if urllib.parse.urlparse(u).netloc.endswith('hisprice.com'): srcs.append(u)
          srcs=list(dict.fromkeys(srcs))
          needles=['function getCookie','getCookie=','function setCookie','setCookie=','shot','JM_SESSION_X','UMID']
          out={'scripts':srcs,'hits':[]}
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.hisprice.com/'}
          for u in srcs:
              try:
                  req=urllib.request.Request(u,headers=headers); s=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception as e:
                  out['hits'].append({'url':u,'error':str(e)}); continue
              matches=[]
              low=s.lower()
              for key in needles:
                  pos=0
                  while True:
                      i=low.find(key.lower(),pos)
                      if i<0: break
                      matches.append({'key':key,'at':i,'excerpt':re.sub(r'\s+',' ',s[max(0,i-700):min(len(s),i+1400)])})
                      pos=i+len(key)
                      if len(matches)>=30: break
                  if len(matches)>=30: break
              if matches: out['hits'].append({'url':u,'length':len(s),'matches':matches})
          pathlib.Path('debug/hisprice-cookie-helpers.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit helper capture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/hisprice-cookie-helpers.json
          git diff --cached --quiet || git commit -m 'chore: capture HisPrice cookie helpers [skip ci]'
          git push
