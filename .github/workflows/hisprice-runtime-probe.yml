name: Bijiago Runtime Probe
on:
  push:
    paths:
      - '.github/workflows/hisprice-runtime-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Bijiago history API
        run: |
          mkdir -p debug
          cat >bijiago-probe.mjs <<'JS'
          import fs from 'fs';
          const item='https://detail.tmall.com/item.htm?id=957929114177';
          const ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36';
          const cookieUrl=`https://browser.bijiago.com/extension?ac=bdextPermanent&format=json&version=${Date.now()}`;
          const c=await fetch(cookieUrl,{headers:{'user-agent':ua}});
          const rawCookie=c.headers.get('set-cookie')||'';
          const parts=[];
          for(const name of ['gwdang_permanent_id','gwdang_permanent_cpt']){
            const m=rawCookie.match(new RegExp(`${name}=([^;,\\s]+)`,'i'));if(m)parts.push(`${name}=${m[1]}`);
          }
          const api=`https://browser.bijiago.com/extension/price_towards?url=${encodeURIComponent(item)}&format=jsonp&union=union_bijiago&from_device=bijiago&version=${Date.now()}`;
          const r=await fetch(api,{headers:{'user-agent':ua,'referer':item,'cookie':parts.join('; ')}});
          const text=await r.text();
          let parsed=null;
          try{parsed=JSON.parse(text)}catch{const a=text.indexOf('{'),b=text.lastIndexOf('}');if(a>=0&&b>a){try{parsed=JSON.parse(text.slice(a,b+1))}catch{}}}
          const compact={cookieStatus:c.status,priceStatus:r.status,cookieNames:parts.map(x=>x.split('=')[0]),length:text.length,text:text.slice(0,60000),parsed};
          fs.writeFileSync('debug/bijiago-runtime.json',JSON.stringify(compact,null,2));
          JS
          node bijiago-probe.mjs
          rm -f bijiago-probe.mjs
      - name: Commit capture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/bijiago-runtime.json
          git diff --cached --quiet || git commit -m 'chore: capture Bijiago response [skip ci]'
          git push
