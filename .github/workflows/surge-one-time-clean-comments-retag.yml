name: Surge one-time clean comments retag
on:
  push:
    paths:
      - '.github/workflows/surge-one-time-clean-comments-retag.yml'
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retag current Surge recovery
        env:
          TARGET: c9f79865624af2a887f12c284437095c9b055c14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa surge-v1.0-20260902 "$TARGET" -m "Surge v1.0 clean General comments - 2026-09-02"
          git push origin refs/tags/surge-v1.0-20260902 --force
