name: One-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete obsolete branches
        shell: bash
        run: |
          set -e
          git push origin --delete '7Sageer-patch-1'
          git push origin --delete 'backup/bilibili-pre-hd-splash-2026-08-30'
          git push origin --delete 'backup/kuwo-pre-cleanup-2026-08-30'
          git push origin --delete 'backup/startupads-pre-baidu-fix-2026-08-30'
          git push origin --delete 'backup/startupads-pre-baidu-netdisk-2026-08-30'
          git push origin --delete 'backup/youtube-pre-playback-fix-2026-08-30'
          git push origin --delete 'exp/performance-123-2026-08-31'
          git push origin --delete 'exp/session-2026-08-29'
          git push origin --delete 'feat/country-group-type'
          git push origin --delete 'feature/unified-airports'
          git push origin --delete 'surge/ximalaya-selfhost-test-v1'
          git push origin --delete 'surge/ximalaya-selfhost-v1'
          git push origin --delete 'surge-status-panel-test-2026-08-31'
          git push origin --delete 'surge-taobao-stable-price'
