name: Finalize Surge v1.0 Tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retag-surge-v1-20260902.yml"

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point release tag to final clean commit
        env:
          TAG_NAME: surge-v1.0-20260902
          TARGET_SHA: 5eacfe9339c28bf2603eb2d70d3343111bc14c35
        run: |
          set -euo pipefail
          git fetch --tags origin
          git push origin ":refs/tags/$TAG_NAME" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Surge stable v1.0 - 2026-09-02 final"
          git push origin "refs/tags/$TAG_NAME"
