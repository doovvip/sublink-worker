name: HisPrice Hidden Probe
on:
  push:
    paths:
      - '.github/workflows/hisprice-hidden-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect page inputs and anti-bot fields
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,http.cookiejar,re,json,pathlib
          item='https://detail.tmall.com/item.htm?id=957929114177'
          page='https://www.hisprice.com/his.php?hisurl='+urllib.parse.quote(item,safe='')
          cj=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148','Accept-Language':'zh-CN,zh;q=0.9'})
          html=op.open(req,timeout=30).read().decode('utf-8','ignore')
          fields=[]
          for tag in re.findall(r'<input\b[^>]*>',html,re.I):
            def attr(n):
              m=re.search(r'\b'+n+r'=["\']([^"\']*)',tag,re.I);return m.group(1) if m else ''
            i,n,v,t=attr('id'),attr('name'),attr('value'),attr('type')
            if re.search(r'(req|check|code|uid|umid|tao|url|mtm|token|key)',i+' '+n,re.I):
              fields.append({'id':i,'name':n,'type':t,'valueLength':len(v),'valuePreview':v[:120] if re.search(r'(url|tao)',i+' '+n,re.I) else ''})
          cookies=[{'name':c.name,'valueLength':len(c.value)} for c in cj]
          assigns=[]
          for m in re.finditer(r'(?:var|let|const)\s+([A-Za-z_$][\w$]*)\s*=\s*["\']([^"\']*)["\']',html):
            k,v=m.group(1),m.group(2)
            if re.search(r'(req|check|code|uid|umid|mtm|token|qd|key)',k,re.I):assigns.append({'name':k,'valueLength':len(v),'valuePreview':v[:80]})
          out={'fields':fields,'cookies':cookies,'assignments':assigns}
          pathlib.Path('debug').mkdir(exist_ok=True)
          pathlib.Path('debug/hisprice-hidden.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit hidden-field map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/hisprice-hidden.json
          git diff --cached --quiet || git commit -m 'chore: capture HisPrice hidden-field map [skip ci]'
          git push
