name: Set Final Surge v1.0 Tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/set-final-surge-tag-20260902.yml"

permissions:
  contents: write

jobs:
  set-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set final annotated tag
        env:
          TAG_NAME: surge-v1.0-20260902
          TARGET_SHA: e5d29ff4561134223881d6ee4a90039940350341
        run: |
          set -euo pipefail
          git fetch --tags origin || true
          git tag -d "$TAG_NAME" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Surge stable v1.0 - 2026-09-02 final"
          git push --force origin "refs/tags/$TAG_NAME"
