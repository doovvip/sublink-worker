name: HisPrice Endpoint Test
on:
  push:
    paths:
      - '.github/workflows/hisprice-endpoint-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test real HisPrice ptinfo endpoint
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, http.cookiejar, re, json, time, pathlib
          item='https://detail.tmall.com/item.htm?id=957929114177'
          page='https://www.hisprice.com/his.php?hisurl='+urllib.parse.quote(item,safe='')
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          headers={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.hisprice.com/'}
          req=urllib.request.Request(page,headers=headers)
          html=op.open(req,timeout=30).read().decode('utf-8','ignore')
          def pick(patterns):
            for p in patterns:
              m=re.search(p,html,re.I)
              if m:return m.group(1)
            return ''
          reqid=pick([r'id=["\']reqid["\'][^>]*value=["\']([^"\']*)',r'name=["\']reqid["\'][^>]*value=["\']([^"\']*)'])
          umid=pick([r'id=["\']UMID["\'][^>]*value=["\']([^"\']*)',r'name=["\']UMID["\'][^>]*value=["\']([^"\']*)'])
          if not reqid: reqid=''
          qt=str(int(time.time()*1000))
          endpoint='https://www.hisprice.com/dm/ptinfo.php?'+urllib.parse.urlencode({'ud':umid,'reqid':reqid,'flg':'1','cd':'P','qt':qt})+'&'
          body=urllib.parse.urlencode({'checkCode':'P','con':item}).encode()
          preq=urllib.request.Request(endpoint,data=body,headers={**headers,'Referer':page,'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','X-Requested-With':'XMLHttpRequest'})
          result={'pageLength':len(html),'reqid':reqid,'hasUmid':bool(umid),'cookies':[c.name for c in cj],'endpointPath':'/dm/ptinfo.php','request':{'flg':'1','cd':'P','checkCode':'P','con':item}}
          try:
            r=op.open(preq,timeout=30); raw=r.read().decode('utf-8','ignore'); result.update({'status':r.status,'contentType':r.headers.get('content-type',''),'length':len(raw)})
            try:
              data=json.loads(raw); result['json']=data
            except Exception:
              result['textPreview']=re.sub(r'\s+',' ',raw)[:1200]
          except Exception as e:
            result['error']=str(e)
          pathlib.Path('debug').mkdir(exist_ok=True)
          pathlib.Path('debug/hisprice-endpoint-test.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit endpoint result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/hisprice-endpoint-test.json
          git diff --cached --quiet || git commit -m 'chore: capture HisPrice ptinfo response [skip ci]'
          git push
