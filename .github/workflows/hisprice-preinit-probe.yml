name: HisPrice Preinit Probe
on:
  push:
    paths:
      - '.github/workflows/hisprice-preinit-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract preinit and request expressions
        run: |
          python - <<'PY'
          import re, json, urllib.request, pathlib
          assets = {
            'chart18': 'https://www.hisprice.com/codejs/chart18.js?t=19',
            'v': 'https://www.hisprice.com/codejs/v.js',
            'gs': 'https://www.hisprice.com/codejs/gs_n1.js?t=1',
          }
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.hisprice.com/'})
            return urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          def body_for(text,name):
            m=re.search(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',text)
            if not m:return ''
            i=m.end()-1; depth=0; quote=None; esc=False
            for j in range(i,len(text)):
              c=text[j]
              if quote:
                if esc: esc=False
                elif c=='\\': esc=True
                elif c==quote: quote=None
                continue
              if c in "'\"`": quote=c; continue
              if c=='{': depth+=1
              elif c=='}':
                depth-=1
                if depth==0:return text[m.start():j+1]
            return ''
          result={}
          for key,url in assets.items():
            text=fetch(url)
            b=body_for(text,'preinit')
            reqs=[]
            scope=b if b else text
            for pat in [r'url\s*:\s*([^,\n}]+)',r'\$\.get\s*\(([^\n;]+)',r'\$\.post\s*\(([^\n;]+)',r'\$\.getJSON\s*\(([^\n;]+)',r'fetch\s*\(([^\n;]+)']:
              reqs += [re.sub(r'\s+',' ',x).strip()[:500] for x in re.findall(pat,scope,re.I)]
            strings=[s for s in re.findall(r'''["']([^"']+)["']''',scope) if len(s)<400 and re.search(r'(php|ajax|api|price|history|chart|mck|check|init|data|/)',s,re.I)]
            result[key]={'hasPreinit':bool(b),'preinitLength':len(b),'requestExpressions':list(dict.fromkeys(reqs))[:40],'strings':list(dict.fromkeys(strings))[:80]}
          pathlib.Path('debug').mkdir(exist_ok=True)
          pathlib.Path('debug/hisprice-preinit.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit targeted analysis
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/hisprice-preinit.json
          git diff --cached --quiet || git commit -m 'chore: capture HisPrice preinit request map [skip ci]'
          git push
