name: Surge one-time status time retag
on:
  push:
    paths:
      - '.github/workflows/surge-one-time-status-time-retag.yml'
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retag current Surge recovery
        env:
          TARGET: 732033b37dc2ae0ff90073a83850dfe3eca17e47
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa surge-v1.0-20260902 "$TARGET" -m "Surge v1.0 General status time - 2026-09-02"
          git push origin refs/tags/surge-v1.0-20260902 --force
