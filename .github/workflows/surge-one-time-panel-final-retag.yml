name: Surge one-time panel final retag
on:
  push:
    paths:
      - '.github/workflows/surge-one-time-panel-final-retag.yml'
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retag final panel recovery
        env:
          TARGET: bb9c02cb027253740136438582e63cafe8f30adb
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa surge-v1.0-20260902 "$TARGET" -m "Surge v1.0 status panel final - 2026-09-02"
          git push origin refs/tags/surge-v1.0-20260902 --force
