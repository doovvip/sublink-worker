name: Surge one-time node relay retag
on:
  push:
    paths:
      - '.github/workflows/surge-one-time-node-relay-retag.yml'
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retag node relay recovery
        env:
          TARGET: 8f7e03b6b726c7c13aeeb093c395ff063282243f
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa surge-v1.0-20260902 "$TARGET" -m "Surge v1.0 node relay fix - 2026-09-02"
          git push origin refs/tags/surge-v1.0-20260902 --force
