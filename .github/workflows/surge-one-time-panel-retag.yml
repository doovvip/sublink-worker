name: Surge one-time panel retag
on:
  push:
    paths:
      - '.github/workflows/surge-one-time-panel-retag.yml'
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retag panel recovery
        env:
          TARGET: a55c001c68446a6d7d32095f5251862fa2549857
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa surge-v1.0-20260902 "$TARGET" -m "Surge v1.0 status panel - 2026-09-02"
          git push origin refs/tags/surge-v1.0-20260902 --force
