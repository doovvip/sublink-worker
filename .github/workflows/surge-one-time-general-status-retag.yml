name: Surge one-time General status retag
on:
  push:
    paths:
      - '.github/workflows/surge-one-time-general-status-retag.yml'
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retag General status recovery
        env:
          TARGET: 4cec94b0b0da0125506b520c286765ff64512518
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa surge-v1.0-20260902 "$TARGET" -m "Surge v1.0 General status summary - 2026-09-02"
          git push origin refs/tags/surge-v1.0-20260902 --force
